<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>صندوق پیام · MYK</title>
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#04060b" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #04060b;
      --surface: #0b1220;
      --surface-2: #101a2c;
      --fg: #e7f3ff;
      --muted: #8aa4bd;
      --primary: #00b4ff;
      --glow: #3df0ff;
      --border: #16324a;
      --danger: #ff6b86;
      --out: #1a3a5c;
      --in: #0f1f30;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: var(--fg); }
    button, input, textarea { font-family: inherit; }
    button { cursor: pointer; border: 0; background: none; color: inherit; }
    input, textarea { width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; color: var(--fg); outline: none; font-size: 14px; }
    input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgb(0 180 255 / 0.2); }
    textarea { resize: vertical; min-height: 90px; }

    .auth { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 20px; background: radial-gradient(ellipse at 50% 0%, #0a1a2e 0%, var(--bg) 70%); }
    .auth-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 40px 32px; box-shadow: 0 0 0 1px rgb(0 180 255 / 0.15), 0 24px 64px rgb(0 0 0 / 0.5); }
    .logo { width: 64px; height: 64px; border-radius: 18px; background: linear-gradient(135deg, #00b4ff, #3df0ff); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; font-weight: 800; font-size: 22px; color: #031018; }
    .auth-card h1 { text-align: center; font-size: 24px; margin-bottom: 6px; }
    .auth-card .sub { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 28px; }
    .auth-card label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 16px; }
    .auth-card label input { margin-top: 6px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; border-radius: 12px; font-weight: 600; font-size: 15px; transition: 0.15s; }
    .btn-primary { width: 100%; background: linear-gradient(135deg, #00b4ff, #0090d0); color: #031018; }
    .btn-primary:hover { filter: brightness(1.08); }
    .err { background: rgba(255,107,134,.12); color: #ff8a9e; padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; display: none; }
    .err.show { display: block; }
    .hint { text-align: center; font-size: 11px; color: var(--muted); margin-top: 22px; opacity: 0.7; }

    .shell { display: none; height: 100dvh; flex-direction: column; }
    .shell.on { display: flex; }
    .topbar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
    .topbar h1 { font-size: 17px; flex: 1; }
    .badge { background: var(--primary); color: #031018; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; }
    .icon-btn { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--muted); }
    .icon-btn:hover { background: var(--surface-2); color: var(--fg); }

    .body { flex: 1; display: flex; overflow: hidden; }
    .list-pane { width: 360px; max-width: 100%; background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
    .search-bar { padding: 12px; }
    .search-bar input { border-radius: 20px; padding: 10px 16px; }
    .msg-list { flex: 1; overflow-y: auto; }
    .msg-item { display: flex; gap: 12px; padding: 14px 16px; cursor: pointer; transition: 0.12s; text-align: right; width: 100%; }
    .msg-item:hover, .msg-item.active { background: var(--surface-2); }
    .msg-item.unread .name { font-weight: 700; }
    .av { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #1a3a5c, #0f1f30); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; flex-shrink: 0; color: var(--primary); }
    .meta { flex: 1; min-width: 0; }
    .name-row { display: flex; align-items: center; gap: 6px; }
    .name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .time { font-size: 11px; color: var(--muted); margin-right: auto; }
    .preview { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); flex-shrink: 0; }

    .detail-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
    .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); gap: 12px; }
    .empty-state svg { opacity: 0.4; }
    .thread-hd { padding: 14px 18px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    .thread-hd .info { flex: 1; }
    .thread-hd .info b { display: block; font-size: 15px; }
    .thread-hd .info span { font-size: 12px; color: var(--muted); }
    .thread-body { flex: 1; overflow-y: auto; padding: 20px 18px; display: flex; flex-direction: column; gap: 12px; }
    .bubble { max-width: 78%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.55; }
    .bubble.them { align-self: flex-start; background: var(--in); border-bottom-right-radius: 4px; }
    .bubble.me { align-self: flex-end; background: var(--out); border-bottom-left-radius: 4px; }
    .bubble .who { font-size: 12px; font-weight: 600; color: var(--primary); margin-bottom: 4px; }
    .bubble .ts { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 6px; text-align: left; }
    .composer { display: flex; gap: 10px; padding: 14px 16px; background: var(--surface); border-top: 1px solid var(--border); align-items: flex-end; }
    .composer textarea { flex: 1; border-radius: 20px; padding: 12px 16px; max-height: 140px; }
    .send-btn { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #00b4ff, #0090d0); color: #031018; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .send-btn:hover { filter: brightness(1.1); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--surface-2); border: 1px solid var(--border); padding: 12px 22px; border-radius: 14px; font-size: 13px; opacity: 0; transition: 0.25s; z-index: 100; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .loading { text-align: center; padding: 40px; color: var(--muted); }

    @media (max-width: 720px) {
      .list-pane { width: 100%; }
      .list-pane.hidden-m { display: none; }
      .detail-pane.hidden-m { display: none; }
    }
  </style>
</head>
<body>
  <div class="auth" id="authScreen">
    <div class="auth-card">
      <div class="logo">MYK</div>
      <h1>صندوق پیام</h1>
      <p class="sub">ورود فقط برای محمد یاسین کرمی</p>
      <div class="err" id="authErr">رمز اشتباه است</div>
      <label>
        رمز عبور
        <input type="password" id="pwdInput" placeholder="••••" autocomplete="current-password" autofocus />
      </label>
      <button class="btn btn-primary" id="loginBtn" type="button">ورود به صندوق</button>
      <p class="hint">رمز پیش‌فرض: 1390</p>
    </div>
  </div>

  <div class="shell" id="shell">
    <div class="topbar">
      <button class="icon-btn" id="backBtn" type="button" title="بازگشت" style="display:none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1>صندوق پیام (SQL)</h1>
      <span class="badge" id="unreadBadge">0</span>
      <button class="icon-btn" id="refreshBtn" type="button" title="بروزرسانی">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
      <button class="icon-btn" id="logoutBtn" type="button" title="خروج">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
    <div class="body">
      <div class="list-pane" id="listPane">
        <div class="search-bar">
          <input type="search" id="searchInput" placeholder="جستجو در پیام‌ها..." />
        </div>
        <div class="msg-list" id="msgList"><div class="loading">در حال بارگذاری...</div></div>
      </div>
      <div class="detail-pane" id="detailPane">
        <div class="empty-state" id="emptyState">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="m22 6-10 7L2 6"/></svg>
          <p>یک پیام را انتخاب کنید</p>
        </div>
        <div id="threadView" style="display:none; flex:1; flex-direction:column; height:100%;">
          <div class="thread-hd">
            <div class="av" id="threadAv">م</div>
            <div class="info">
              <b id="threadName">—</b>
              <span id="threadContact">—</span>
            </div>
            <button class="icon-btn" id="deleteBtn" type="button" title="حذف">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
            </button>
          </div>
          <div class="thread-body" id="threadBody"></div>
          <div class="composer">
            <textarea id="replyInput" placeholder="پاسخ به عنوان محمد یاسین کرمی..." rows="1"></textarea>
            <button class="send-btn" id="sendReply" type="button" title="ارسال">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
  const API = '/api/messages';
  const OWNER_NAME = 'محمد یاسین کرمی';
  let TOKEN = sessionStorage.getItem('myk_inbox_token') || '';
  let messagesCache = [];
  let activeId = null;
  let searchQ = '';

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }
  function fmtTime(iso) {
    try {
      const d = new Date(iso);
      const today = new Date();
      if (d.toDateString() === today.toDateString()) {
        return d.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
      }
      return d.toLocaleDateString('fa-IR', { month: 'short', day: 'numeric' }) + ' ' +
             d.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
    } catch { return ''; }
  }
  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }
  function initial(n) {
    return ((n || 'م').trim()[0] || 'م').toUpperCase();
  }

  const authScreen = document.getElementById('authScreen');
  const shell = document.getElementById('shell');
  const pwdInput = document.getElementById('pwdInput');
  const loginBtn = document.getElementById('loginBtn');
  const authErr = document.getElementById('authErr');

  async function doLogin() {
    const val = pwdInput.value.trim();
    if (!val) return;
    loginBtn.disabled = true;
    loginBtn.textContent = 'در حال ورود...';

    try {
      const res = await fetch(API, {
        headers: { Authorization: 'Bearer ' + val }
      });
      if (res.status === 401) {
        authErr.classList.add('show');
        pwdInput.value = '';
        pwdInput.focus();
        loginBtn.disabled = false;
        loginBtn.textContent = 'ورود به صندوق';
        return;
      }
      TOKEN = val;
      sessionStorage.setItem('myk_inbox_token', TOKEN);
      authScreen.style.display = 'none';
      shell.classList.add('on');
      await loadMessages();
    } catch (e) {
      authErr.textContent = 'خطا در اتصال به سرور';
      authErr.classList.add('show');
    }
    loginBtn.disabled = false;
    loginBtn.textContent = 'ورود به صندوق';
  }

  loginBtn.onclick = doLogin;
  pwdInput.onkeydown = (e) => { if (e.key === 'Enter') doLogin(); };

  document.getElementById('logoutBtn').onclick = () => {
    sessionStorage.removeItem('myk_inbox_token');
    TOKEN = '';
    location.reload();
  };

  document.getElementById('refreshBtn').onclick = () => loadMessages();

  async function api(method, path = '', body = null) {
    const opts = {
      method,
      headers: {
        'Authorization': 'Bearer ' + TOKEN,
        'Content-Type': 'application/json'
      }
    };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(API + path, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'خطا');
    return data;
  }

  async function loadMessages() {
    const el = document.getElementById('msgList');
    el.innerHTML = '<div class="loading">در حال بارگذاری...</div>';
    try {
      const data = await api('GET');
      messagesCache = data.messages || [];
      renderList();
    } catch (e) {
      el.innerHTML = '<div class="loading" style="color:var(--danger)">خطا: ' + esc(e.message) + '</div>';
    }
  }

  function getFiltered() {
    let list = [...messagesCache];
    if (searchQ) {
      const q = searchQ.toLowerCase();
      list = list.filter(t =>
        ((t.name || '') + ' ' + (t.contact || '') + ' ' + (t.body || '')).toLowerCase().includes(q)
      );
    }
    return list;
  }

  function renderList() {
    const list = getFiltered();
    const el = document.getElementById('msgList');
    const unread = list.filter(t => !t.is_read).length;
    document.getElementById('unreadBadge').textContent = unread;

    if (!list.length) {
      el.innerHTML = '<div style="padding:40px 20px;text-align:center;color:var(--muted);font-size:14px;">هنوز پیامی نیومده</div>';
      return;
    }

    el.innerHTML = list.map(t =>
      '<button class="msg-item ' + (t.id === activeId ? 'active' : '') + ' ' + (!t.is_read ? 'unread' : '') + '" data-id="' + t.id + '" type="button">' +
        '<div class="av">' + esc(initial(t.name)) + '</div>' +
        '<div class="meta">' +
          '<div class="name-row">' +
            '<span class="name">' + esc(t.name) + '</span>' +
            (!t.is_read ? '<span class="dot"></span>' : '') +
            '<span class="time">' + fmtTime(t.created_at) + '</span>' +
          '</div>' +
          '<div class="preview">' + esc((t.body || '').slice(0, 60)) + ((t.body || '').length > 60 ? '…' : '') + '</div>' +
        '</div>' +
      '</button>'
    ).join('');

    el.querySelectorAll('[data-id]').forEach(btn => {
      btn.onclick = () => openThread(btn.getAttribute('data-id'));
    });
  }

  async function openThread(id) {
    activeId = id;
    const msg = messagesCache.find(m => m.id === id);
    if (!msg) return;

    if (!msg.is_read) {
      try {
        await api('POST', '?action=read', { messageId: id });
        msg.is_read = true;
      } catch {}
    }

    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('threadView').style.display = 'flex';

    document.getElementById('threadAv').textContent = initial(msg.name);
    document.getElementById('threadName').textContent = msg.name || 'مهمان';
    document.getElementById('threadContact').textContent = msg.contact || '—';

    const replies = msg.replies || [];
    const body = document.getElementById('threadBody');
    body.innerHTML =
      '<div class="bubble them">' +
        '<div class="who">' + esc(msg.name || 'مهمان') + '</div>' +
        esc(msg.body || '').replace(/\n/g, '<br>') +
        '<div class="ts">' + fmtTime(msg.created_at) + '</div>' +
      '</div>' +
      replies.map(r =>
        '<div class="bubble me">' +
          '<div class="who">' + esc(r.from_name || OWNER_NAME) + '</div>' +
          esc(r.body || '').replace(/\n/g, '<br>') +
          '<div class="ts">' + fmtTime(r.created_at) + '</div>' +
        '</div>'
      ).join('');
    body.scrollTop = body.scrollHeight;

    if (window.innerWidth <= 720) {
      document.getElementById('listPane').classList.add('hidden-m');
      document.getElementById('detailPane').classList.remove('hidden-m');
      document.getElementById('backBtn').style.display = 'flex';
    }
    renderList();
  }

  document.getElementById('backBtn').onclick = () => {
    document.getElementById('listPane').classList.remove('hidden-m');
    document.getElementById('detailPane').classList.add('hidden-m');
    document.getElementById('backBtn').style.display = 'none';
    activeId = null;
    renderList();
  };

  document.getElementById('searchInput').oninput = (e) => {
    searchQ = e.target.value.trim();
    renderList();
  };

  document.getElementById('sendReply').onclick = async () => {
    const input = document.getElementById('replyInput');
    const text = input.value.trim();
    if (!text || !activeId) return;

    const btn = document.getElementById('sendReply');
    btn.disabled = true;
    try {
      await api('POST', '?action=reply', { messageId: activeId, body: text });
      input.value = '';
      toast('پاسخ ذخیره شد');
      await loadMessages();
      openThread(activeId);
    } catch (e) {
      toast('خطا: ' + e.message);
    }
    btn.disabled = false;
  };

  document.getElementById('replyInput').onkeydown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      document.getElementById('sendReply').click();
    }
  };

  document.getElementById('deleteBtn').onclick = async () => {
    if (!activeId || !confirm('این گفتگو حذف شود؟')) return;
    try {
      await api('POST', '?action=delete', { messageId: activeId });
      activeId = null;
      document.getElementById('threadView').style.display = 'none';
      document.getElementById('emptyState').style.display = 'flex';
      toast('حذف شد');
      await loadMessages();
    } catch (e) {
      toast('خطا: ' + e.message);
    }
  };

  if (TOKEN) {
    authScreen.style.display = 'none';
    shell.classList.add('on');
    loadMessages();
  }
  </script>
</body>
</html>
